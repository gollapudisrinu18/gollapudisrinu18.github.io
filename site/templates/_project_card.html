<article class="card project-card">
  <span class="badge {{ 'teal' if p.tier == 'supporting' else '' }}">{{ 'Flagship' if p.tier == 'flagship' else 'Supporting' }}</span>
  <h3 style="margin-top:.6rem"><a href="{{ root }}projects/{{ p.slug }}.html">{{ p.title }}</a></h3>
  <p>{{ p.short }}</p>
  <ul class="chips" aria-label="Technologies">{% for s in p.stack %}<li class="chip">{{ s }}</li>{% endfor %}</ul>
  <div class="links">
    <a href="{{ root }}projects/{{ p.slug }}.html">Case study</a>
    <a href="{{ p.links.source }}">Source</a>
    <a href="{{ root }}projects/{{ p.slug }}.html#architecture">Architecture</a>
    <a href="{{ root }}demos/{{ p.slug }}.html">Demo</a>
    <a href="{{ p.links.issues_doc }}">Issues</a>
  </div>
</article>
