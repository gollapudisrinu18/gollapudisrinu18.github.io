apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-pinned-image
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [supplychain]
      validate:
        message: "Use an immutable tag or digest, not :latest."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
