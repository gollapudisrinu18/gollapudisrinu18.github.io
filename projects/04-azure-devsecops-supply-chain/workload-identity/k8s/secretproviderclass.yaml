# Secrets Store CSI driver (Azure provider) using Workload ID - no secrets in Kubernetes manifests.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: kv-demo-app
  namespace: supplychain
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "<CLIENT_ID>"
    keyvaultName: "<KEYVAULT_NAME>"
    tenantId: "<TENANT_ID>"
    objects: |
      array:
        - |
          objectName: app-db-password
          objectType: secret
