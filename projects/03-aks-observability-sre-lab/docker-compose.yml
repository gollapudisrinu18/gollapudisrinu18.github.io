# Local observability stack: service + OTel Collector + Prometheus + Grafana + load.
#   docker compose up -d --build
#   Grafana: http://localhost:3000 (anonymous viewer), Prometheus: http://localhost:9090
services:
  checkout-api:
    build: ./service
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports: ["8080:8080"]
    depends_on: [otel-collector]

  loadgen:
    image: python:3.12-slim
    volumes: ["./loadgen:/loadgen:ro"]
    command: ["python", "/loadgen/loadgen.py", "--url", "http://checkout-api:8080/api/checkout", "--rps", "20"]
    depends_on: [checkout-api]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4317:4317", "4318:4318"]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
