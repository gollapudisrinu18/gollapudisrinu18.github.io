global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: checkout-api
    metrics_path: /metrics
    static_configs:
      - targets: ["checkout-api:8080"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
