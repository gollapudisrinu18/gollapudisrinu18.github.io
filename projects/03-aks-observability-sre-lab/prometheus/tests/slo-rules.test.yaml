# promtool test rules prometheus/tests/slo-rules.test.yaml
# 100 requests/min. From minute 30, only 40 of 100 requests per minute finish
# within 300 ms (60% bad), the same shape as the lab incident.
rule_files:
  - ../rules/slo-rules.yaml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_count{service="checkout-api",route="/api/checkout"}'
        values: '0+100x120'
      - series: 'http_request_duration_seconds_bucket{service="checkout-api",route="/api/checkout",le="0.3"}'
        values: '0+100x30 3040+40x89'
    alert_rule_test:
      - eval_time: 25m
        alertname: CheckoutLatencyBudgetFastBurn
        exp_alerts: []
      - eval_time: 50m
        alertname: CheckoutLatencyBudgetFastBurn
        exp_alerts:
          - exp_labels:
              severity: page
              slo: checkout-latency
            exp_annotations:
              summary: checkout-api is burning its latency error budget 14.4x faster than allowed
              runbook_url: https://github.com/gollapudisrinu18/my-profile/blob/main/projects/03-aks-observability-sre-lab/docs/runbook.md
